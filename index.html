<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Live Flight Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#0f1216;
  --bar-bg:rgba(17,20,25,0.94);
  --bar-bg-solid:#14171c;
  --card-bg:#ffffff;
  --text:#eef1f5;
  --text-dim:#98a1ad;
  --text-dark:#161a1f;
  --text-dark-dim:#6b7280;
  --accent:#2f7bf6;
  --accent-2:#ff8c1a;
  --line:#262b33;
  --line-light:#e7e9ec;
  --radius:16px;
  --shadow:0 10px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100vh;height:100dvh;margin:0;padding:0;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
button{font-family:inherit;}
#map{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;background:#9fc4d8;z-index:10;}
.leaflet-container{background:#9fc4d8;}

/* ---------- Top bar / search ---------- */
#topbar{position:absolute;top:0;left:0;right:0;z-index:500;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 30px;
  background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,0));
  pointer-events:none;display:flex;gap:10px;align-items:center;}
#searchPill{pointer-events:auto;flex:1;max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px;
  background:#fff;border-radius:999px;padding:11px 16px;box-shadow:var(--shadow);border:none;cursor:pointer;
  color:#9aa1ab;font-size:15px;text-align:left;}
#searchPill svg{flex:none;color:#7b828d;}
#acCount{pointer-events:auto;position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:12px;z-index:500;
  background:rgba(17,20,25,.7);color:#fff;font-size:11px;font-weight:600;padding:6px 10px;border-radius:999px;
  letter-spacing:.02em;white-space:nowrap;}
#acCount.loading{opacity:.6;}

/* ---------- Search overlay (shortcuts screen) ---------- */
#searchOverlay{position:fixed;inset:0;z-index:2000;background:var(--bar-bg-solid);display:none;flex-direction:column;}
#searchOverlay.open{display:flex;}
.so-header{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px;}
.so-title{flex:1;text-align:center;font-size:18px;font-weight:600;margin-right:28px;}
.so-close{background:none;border:none;color:#fff;width:28px;height:28px;cursor:pointer;}
.so-input-wrap{padding:6px 16px 14px;}
#overlayInput{width:100%;background:#fff;border:none;border-radius:999px;padding:13px 18px;font-size:15px;outline:none;}
.so-section-label{padding:14px 16px 6px;color:#9098a3;font-size:12px;letter-spacing:.06em;font-weight:600;
  background:#22262e;}
.so-row{display:flex;align-items:center;gap:14px;padding:15px 16px;background:#e9ebee1a;cursor:pointer;
  border-bottom:1px solid #ffffff12;color:#fff;}
.so-row:active{background:#ffffff14;}
.so-row svg{flex:none;color:#dfe2e6;}
.so-row span{flex:1;font-size:15.5px;}
.so-row .chev{color:#8b929c;}
#overlayBody{flex:1;overflow-y:auto;}
.so-panel{padding:8px 16px 24px;color:#fff;display:none;}
.so-panel.open{display:block;}
.so-panel label{display:block;font-size:12px;color:#9098a3;margin:14px 0 6px;}
.so-panel input, .so-panel select{width:100%;background:#fff;border:none;border-radius:10px;padding:11px 14px;font-size:15px;outline:none;}
.so-go{margin-top:16px;width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;}

/* ---------- Map controls ---------- */
#mapControls{position:absolute;right:12px;bottom:88px;z-index:400;display:flex;flex-direction:column;gap:10px;align-items:flex-end;}
.round-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.96);box-shadow:var(--shadow);
  border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#222;}
.round-btn:active{background:#e9ebee;}
.round-btn.active{background:var(--accent);color:#fff;}
#zoomGroup{display:none;flex-direction:column;background:#fff;border-radius:22px;box-shadow:var(--shadow);overflow:hidden;}
#zoomGroup button{width:44px;height:40px;border:none;background:none;font-size:19px;color:#222;cursor:pointer;}
#zoomGroup button:first-child{border-bottom:1px solid #e6e8eb;}
@media (min-width:760px){ #zoomGroup{display:flex;} }
#locateBtn{position:absolute;left:12px;bottom:88px;z-index:400;}

/* ---------- Toast ---------- */
#toast{position:absolute;left:50%;bottom:80px;transform:translate(-50%,20px);z-index:1800;
  background:rgba(20,23,28,.95);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;
  max-width:86%;text-align:center;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:var(--shadow);}
#toast.show{opacity:1;transform:translate(-50%,0);}

/* ---------- Bottom bars ---------- */
#bottomBarDefault,#bottomBarSelected{position:absolute;left:0;right:0;bottom:0;z-index:520;
  background:var(--bar-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:8px 4px calc(env(safe-area-inset-bottom,0px) + 6px);display:flex;justify-content:space-around;
  border-top:1px solid #ffffff10;}
#bottomBarSelected{display:none;}
.bb-btn{background:none;border:none;color:#c3c9d1;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.8px;padding:5px 6px;cursor:pointer;flex:1;max-width:90px;}
.bb-btn svg{width:22px;height:22px;}
.bb-btn.active,.bb-btn:active{color:var(--accent);}

/* ---------- Info panel (bottom sheet) ---------- */
#infoPanel{position:absolute;left:0;right:0;bottom:64px;z-index:610;background:var(--card-bg);color:var(--text-dark);
  border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.35);max-height:62vh;overflow-y:auto;
  transform:translateY(115%);transition:transform .25s ease;padding-bottom:10px;}
#infoPanel.open{transform:translateY(0);}
.ip-handle{width:36px;height:4px;background:#d8dade;border-radius:3px;margin:8px auto 4px;}
.ip-head{display:flex;align-items:flex-start;justify-content:space-between;padding:6px 16px 4px;}
.ip-head .cs{color:var(--accent-2);font-size:19px;font-weight:700;letter-spacing:.01em;}
.ip-head .chips span{display:inline-block;background:#eef0f2;color:#4b5563;font-size:11px;font-weight:600;
  padding:3px 7px;border-radius:5px;margin-left:6px;}
.ip-airline{padding:0 16px;color:var(--text-dark-dim);font-size:13px;margin-top:2px;}
.ip-photo{margin:10px 16px;border-radius:10px;overflow:hidden;background:#eee;height:150px;display:flex;align-items:center;justify-content:center;position:relative;}
.ip-photo img{width:100%;height:100%;object-fit:cover;}
.ip-route{display:flex;align-items:center;padding:14px 16px 4px;gap:10px;}
.ip-route .apcode{font-size:26px;font-weight:800;line-height:1;}
.ip-route .apname{font-size:11px;color:var(--text-dark-dim);text-transform:uppercase;margin-top:3px;letter-spacing:.03em;}
.ip-route .mid{flex:1;text-align:center;color:var(--accent);}
.ip-progress{position:relative;height:3px;background:#e5e7eb;border-radius:2px;margin:6px 16px 2px;}
.ip-progress .bar{position:absolute;left:0;top:0;height:100%;background:var(--accent-2);border-radius:2px;}
.ip-progress .plane{position:absolute;top:-8px;width:18px;height:18px;transform:translateX(-9px);color:var(--accent-2);}
.ip-times{display:flex;justify-content:space-between;padding:6px 16px 12px;font-size:12.5px;color:var(--text-dark-dim);}
.ip-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line-light);}
.ip-grid > div{padding:12px 16px;border-bottom:1px solid var(--line-light);}
.ip-grid label{display:block;font-size:10.5px;color:#9aa1ab;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
.ip-grid .val{font-size:16px;font-weight:600;}
.ip-note{margin:10px 16px 4px;font-size:12px;color:#9aa1ab;line-height:1.4;}

/* ---------- More info full panel ---------- */
#moreInfoPanel{position:fixed;inset:0;z-index:1700;background:var(--card-bg);color:var(--text-dark);
  overflow-y:auto;transform:translateX(105%);transition:transform .25s ease;}
#moreInfoPanel.open{transform:translateX(0);}
.mi-topbar{display:flex;align-items:flex-start;gap:12px;background:#181b20;color:#fff;padding:calc(env(safe-area-inset-top,0px)+14px) 16px 14px;}
.mi-topbar .cs{color:var(--accent-2);font-size:19px;font-weight:700;}
.mi-topbar .chips span{display:inline-block;background:#2b2f36;color:#c7ccd3;font-size:10.5px;font-weight:600;
  padding:3px 6px;border-radius:5px;margin-left:6px;}
.mi-topbar .airline{font-size:12.5px;color:#9aa1ab;margin-top:2px;}
.mi-topbar .close{margin-left:auto;background:none;border:none;color:#fff;width:26px;height:26px;cursor:pointer;flex:none;}
.mi-photo{height:220px;background:#111;display:flex;align-items:center;justify-content:center;position:relative;}
.mi-photo img{width:100%;height:100%;object-fit:cover;}
.mi-route{display:flex;text-align:center;border-bottom:1px solid var(--line-light);}
.mi-route > div{flex:1;padding:14px 8px;}
.mi-route .code{font-size:30px;font-weight:800;}
.mi-route .city{font-size:12px;color:var(--text-dark-dim);text-transform:uppercase;letter-spacing:.02em;}
.mi-route .mid{flex:0 0 46px;display:flex;align-items:center;justify-content:center;color:var(--accent);}
.mi-timegrid{display:flex;border-bottom:1px solid var(--line-light);}
.mi-timegrid > div{flex:1;padding:10px 16px 14px;}
.mi-timegrid label{display:block;font-size:10.5px;color:#9aa1ab;text-transform:uppercase;margin-bottom:4px;letter-spacing:.03em;}
.mi-timegrid .v{font-size:20px;font-weight:700;}
.mi-progresswrap{padding:10px 16px 14px;border-bottom:1px solid var(--line-light);}
.mi-progressbar{position:relative;height:4px;background:#e5e7eb;border-radius:2px;}
.mi-progressbar .fill{position:absolute;left:0;top:0;height:100%;background:var(--accent-2);border-radius:2px;}
.mi-progresswrap .lbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-dark-dim);margin-top:6px;}
.mi-section-head{display:flex;align-items:center;gap:10px;background:var(--accent);color:#fff;padding:13px 16px;
  cursor:pointer;font-size:14.5px;font-weight:600;}
.mi-section-head svg.chev{margin-left:auto;transition:transform .2s;}
.mi-section-head.closed svg.chev{transform:rotate(-90deg);}
.mi-section-body{background:#f4f5f7;padding:2px 0;display:block;}
.mi-section-body.closed{display:none;}
.mi-fieldrow{display:flex;border-bottom:1px solid #e6e8eb;}
.mi-fieldrow > div{flex:1;padding:12px 16px;}
.mi-fieldrow label{display:block;font-size:11px;color:#9aa1ab;text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px;}
.mi-fieldrow .v{font-size:15px;font-weight:600;}
.mi-empty{padding:16px;font-size:13px;color:#8b929c;line-height:1.5;}
#altSpeedChart{width:100%;height:140px;display:block;}

/* ---------- misc icons ---------- */
.ac-icon{background:none;border:none;}
.ac-outer{position:relative;}
.ac-rot{transition:transform .35s linear;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));}
.ac-icon.selected .ac-rot{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 9px #2f7bf6);}
.ac-label{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:2px;display:flex;align-items:center;
  gap:3px;background:rgba(17,20,25,.82);color:#fff;font-size:10px;font-weight:600;padding:2px 6px 2px 3px;
  border-radius:5px;white-space:nowrap;pointer-events:none;}
.ac-label img{width:13px;height:13px;border-radius:2px;object-fit:contain;background:#fff;}
.me-dot{width:16px;height:16px;position:relative;}
.me-dot::after{content:'';position:absolute;inset:0;background:var(--accent);border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 2px rgba(47,123,246,.4);}
.me-pulse{position:absolute;inset:-10px;border-radius:50%;background:rgba(47,123,246,.35);animation:pulse 2s ease-out infinite;}
@keyframes pulse{0%{transform:scale(.3);opacity:.8;}100%{transform:scale(1.6);opacity:0;}}
.leaflet-popup-content-wrapper{border-radius:10px;}
</style>
</head>
<body>

<div id="map"></div>

<div id="topbar">
  <button id="searchPill">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
    <span id="searchPillLabel">Flight number, airport, route or reg.</span>
  </button>
</div>
<div id="acCount">— aircraft</div>

<div id="searchOverlay">
  <div class="so-header">
    <div class="so-title">Search</div>
    <button class="so-close" id="soClose">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
    </button>
  </div>
  <div class="so-input-wrap">
    <input id="overlayInput" placeholder="Flight number, airport, route or reg." autocomplete="off">
  </div>
  <div id="overlayBody">
    <div class="so-section-label">SHORTCUTS TO FIND</div>
    <div class="so-row" data-shortcut="route">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="6" r="2.4"/><circle cx="19" cy="18" r="2.4"/><path d="M7 7 L17 17"/></svg>
      <span>Flight by route</span>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 6 15 12 9 18"/></svg>
    </div>
    <div class="so-row" data-shortcut="airline">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2.5 1.8V22l4-1 4 1v-1.2L13 19v-5.5z"/></svg>
      <span>LIVE flight by airline</span>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 6 15 12 9 18"/></svg>
    </div>
    <div class="so-panel" id="panel-route">
      <label>From (ICAO or IATA)</label>
      <input id="routeFrom" placeholder="e.g. ALC or LEAL">
      <label>To (ICAO or IATA)</label>
      <input id="routeTo" placeholder="e.g. SEN or EGMC">
      <button class="so-go" id="routeGo">Show route</button>
    </div>
    <div class="so-panel" id="panel-airline">
      <label>Airline ICAO code (from callsign)</label>
      <input id="airlineCode" placeholder="e.g. EZY" style="text-transform:uppercase">
      <button class="so-go" id="airlineGo">Find in current view</button>
    </div>
  </div>
</div>

<div id="mapControls">
  <div id="zoomGroup">
    <button id="zoomIn">+</button>
    <button id="zoomOut">&minus;</button>
  </div>
</div>
<button id="locateBtn" class="round-btn" title="My location">
  <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
</button>

<div id="toast"></div>

<!-- Default bottom bar -->
<div id="bottomBarDefault">
  <button class="bb-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.64 9.6a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>Settings</button>
  <button class="bb-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.6-1.7A4.5 4.5 0 0 0 6.5 19h11z"/></svg>Weather</button>
  <button class="bb-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.5 10 19 14 21 14 12.5 22 3"/></svg>Filters</button>
  <button class="bb-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>Alerts</button>
</div>

<!-- Bottom bar when aircraft selected -->
<div id="bottomBarSelected">
  <button class="bb-btn" id="btn3d"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>3D view</button>
  <button class="bb-btn" id="btnRoute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="18" r="2.4"/><path d="M8 7l8 10"/></svg>Route</button>
  <button class="bb-btn" id="btnMoreInfo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16.5"/><circle cx="12" cy="7.7" r="0.9" fill="currentColor" stroke="none"/></svg>More info</button>
  <button class="bb-btn" id="btnFollow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="16 3 21 3 21 8"/><polyline points="8 21 3 21 3 16"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>Follow</button>
</div>

<!-- Info Panel -->
<div id="infoPanel"></div>

<!-- More Info Full Panel -->
<div id="moreInfoPanel"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
"use strict";

const AIRPORTS = [
["EGLL","LHR","London Heathrow","London","United Kingdom",51.4700,-0.4543],
["LEMD","MAD","Madrid-Barajas","Madrid","Spain",40.4936,-3.5668],
["LEAL","ALC","Alicante-Elche","Alicante","Spain",38.2822,-0.5582],
["KJFK","JFK","John F Kennedy Intl","New York","United States",40.6413,-73.7781]
].map(a=>({icao:a[0],iata:a[1],name:a[2],city:a[3],country:a[4],lat:a[5],lon:a[6]}));

const TYPE_NAMES = {
  A320:"Airbus A320", B738:"Boeing 737-800", B77W:"Boeing 777-300ER", B789:"Boeing 787-9"
};

const PLANE_PATH = "M12 1 L13.4 8.2 L22 13 L13.1 12.2 L14 19 L17.6 21.6 L17.6 22.8 L12 21.1 L6.4 22.8 L6.4 21.6 L10 19 L10.9 12.2 L2 13 L10.6 8.2 Z";
const HELI_PATH = "M11 3 h2 v5 h-2 Z M1 8.6 h22 v1.2 h-22 Z M9.4 9.9 h5.2 v5.8 h-5.2 Z M11 15.7 h2 v6 h-2 Z M8 21.7 h8 v1.2 h-8 Z";

let map, acLayer;
let markers = {};
let aircraftData = {};
let selectedHex = null;
let followMode = false;
let pollTimer = null;
let currentRoute = null;
let currentPhoto = null;
let graphSamples = [];
let miSections = { info:true, recent:false, chart:true, source:false, travelers:false };

function $(id){ return document.getElementById(id); }

function toast(msg, ms){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._tm); toast._tm = setTimeout(()=>t.classList.remove("show"), ms||2800);
}

function initMap(){
  map = L.map('map', { zoomControl:false, worldCopyJump:true }).setView([41.35, 2.05], 8);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom:19, subdomains:'abcd' }).addTo(map);
  acLayer = L.layerGroup().addTo(map);
  map.on('moveend', debouncedLoad);
  map.on('zoomend', refreshAllIcons);
  $("zoomIn").addEventListener('click', ()=>map.zoomIn());
  $("zoomOut").addEventListener('click', ()=>map.zoomOut());

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos => {
      map.setView([pos.coords.latitude, pos.coords.longitude], 9);
    }, () => {}, {timeout:4000});
  }
}

function altColor(altFt, onGround){
  if(onGround) return "#9aa0a6";
  if(altFt==null) return "#c9ccd1";
  const a = Math.max(0, Math.min(45000, altFt));
  const hue = 24 + (a/45000)*276;
  return `hsl(${hue.toFixed(0)},82%,54%)`;
}

function getViewWidthKm(){
  const b = map.getBounds(), c = map.getCenter();
  return L.latLng(c.lat,b.getWest()).distanceTo(L.latLng(c.lat,b.getEast()))/1000;
}

function createAcIcon(ac){
  const onGround = ac.alt_baro==="ground";
  const altFt = onGround ? 0 : ac.alt_baro;
  const color = altColor(altFt, onGround);
  const track = ac.track || ac.true_heading || 0;
  let path = ac.category === "A7" ? HELI_PATH : PLANE_PATH;

  const showLabel = getViewWidthKm() < 250;
  let label = "";
  if(showLabel && ac.flight){
    const code = ac.flight.trim().slice(0,3).toUpperCase();
    const logo = `<img src="https://content.airhex.com/content/logos/airlines_${code}_50_50_s.png?background=FFFFFF" onerror="this.style.display='none'">`;
    label = `<div class="ac-label">${logo}<span>${ac.flight.trim()}</span></div>`;
  }

  const halo = ac.hex === selectedHex ? '<circle cx="12" cy="12" r="10.5" fill="rgba(255,255,255,.001)"/>' : "";
  const html = `<div class="ac-outer"><div class="ac-rot" style="transform:rotate(${track}deg)"><svg width="22" height="22" viewBox="0 0 24 24">${halo}<path d="${path}" fill="${color}" stroke="rgba(0,0,0,.55)" stroke-width="0.7"/></svg></div>${label}</div>`;

  return L.divIcon({ html, className: "ac-icon" + (ac.hex===selectedHex ? " selected" : ""), iconSize:[22,22], iconAnchor:[11,11] });
}

function refreshAllIcons(){
  Object.keys(markers).forEach(hex=>{ if(aircraftData[hex]) markers[hex].setIcon(createAcIcon(aircraftData[hex])); });
}

let loadDebounceTm = null;
function debouncedLoad(){ clearTimeout(loadDebounceTm); loadDebounceTm = setTimeout(loadAircraft, 500); }

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  loadAircraft();
  pollTimer = setInterval(loadAircraft, 10000); // Changed from 8000 to 10000
}

async function loadAircraft(){
  if(!map) return;
  const center = map.getCenter();
  const radiusNm = 50; // Radius in nautical miles
  const url = `https://api.adsb.lol/v2/point/${center.lat.toFixed(4)}/${center.lng.toFixed(4)}/${radiusNm}`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
    const data = await res.json();

    const list = data.ac || [];
    updateMarkers(list);
    $("acCount").textContent = list.length.toLocaleString() + " aircraft";
  } catch(e) {
    console.error("Live fetch failed:", e);
    $("acCount").textContent = "offline — retrying";
  }
}

function updateMarkers(list){
  const seen = new Set();
  list.forEach(ac=>{
    if(typeof ac.lat !== "number") return;
    seen.add(ac.hex);
    aircraftData[ac.hex] = ac;
    if(markers[ac.hex]){
      markers[ac.hex].setLatLng([ac.lat, ac.lon]).setIcon(createAcIcon(ac));
    } else {
      let m = L.marker([ac.lat, ac.lon], { icon: createAcIcon(ac) }).addTo(acLayer);
      m.on('click', ()=>selectAircraft(ac.hex));
      markers[ac.hex] = m;
    }
  });

  Object.keys(markers).forEach(hex=>{
    if(!seen.has(hex)){ acLayer.removeLayer(markers[hex]); delete markers[hex]; delete aircraftData[hex]; }
  });

  if(selectedHex && aircraftData[selectedHex]){
    const ac = aircraftData[selectedHex];
    graphSamples.push({ t:Date.now(), alt: ac.alt_baro||0, gs: ac.gs||0 });
    renderInfoPanel();
    if($("moreInfoPanel").classList.contains("open")) renderMoreInfo();
    if(followMode) map.panTo([ac.lat, ac.lon]);
  }
}

// ---------------- UI & SELECTIONS ---------------- //

function openPanel(el){ el.classList.add("open"); }
function closePanel(el){ el.classList.remove("open"); }

async function selectAircraft(hex){
  selectedHex = hex;
  $("bottomBarDefault").style.display = "none";
  $("bottomBarSelected").style.display = "flex";
  refreshAllIcons();
  renderInfoPanel();
  openPanel($("infoPanel"));
}

function deselectAircraft(){
  selectedHex = null; followMode = false;
  closePanel($("infoPanel"));
  closePanel($("moreInfoPanel"));
  $("bottomBarSelected").style.display = "none";
  $("bottomBarDefault").style.display = "flex";
  $("btnFollow").classList.remove("active");
  refreshAllIcons();
}

function renderInfoPanel(){
  const ac = aircraftData[selectedHex];
  if(!ac) return;
  const cs = ac.flight ? ac.flight.trim() : ac.hex;
  const alt = ac.alt_baro === "ground" ? "Ground" : Math.round(ac.alt_baro*0.3048) + " m";
  const speed = Math.round((ac.gs||0)*1.852) + " km/h";

  $("infoPanel").innerHTML = `
    <div class="ip-handle"></div>
    <div class="ip-head"><div class="cs">${cs}</div></div>
    <div class="ip-airline">${ac.t || "Unknown"} &middot; ${ac.r || "No Reg"}</div>
    <div class="ip-grid">
      <div><label>Barometric alt.</label><div class="val">${alt}</div></div>
      <div><label>Ground speed</label><div class="val">${speed}</div></div>
    </div>
  `;
}

// THIS FUNCTION WAS TRUNCATED IN THE ORIGINAL RESPONSE

  const panel = $("moreInfoPanel");

        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>

      <div class="mi-fieldrow">
        <div><label>Source</label><div class="v">Airplanes.live API</div></div>
        <div><label>Coordinates</label><div class="v">${ac.lat.toFixed(4)}, ${ac.lon.toFixed(4)}</div></div>

document.addEventListener("DOMContentLoaded", () => {
  initMap();
  startPolling();

  // Search shortcuts
  $("searchPill").addEventListener("click", () => openPanel($("searchOverlay")));
  $("soClose").addEventListener("click", () => closePanel($("searchOverlay")));

  document.querySelectorAll(".so-row").forEach(row => {
    row.addEventListener("click", () => {
       document.querySelectorAll(".so-panel").forEach(p => p.classList.remove("open"));
       $( `panel-${row.getAttribute("data-shortcut")}` ).classList.add("open");
    });
  });

  // Bottom action buttons
  $("btnMoreInfo").addEventListener("click", () => {
    renderMoreInfo();
    openPanel($("moreInfoPanel"));
  });

  $("btnFollow").addEventListener("click", (e) => {
    followMode = !followMode;
    e.currentTarget.classList.toggle("active", followMode);
  });

  $("btnRoute").addEventListener("click", () => {
    if(!selectedHex || !aircraftData[selectedHex]) return;
    const ac = aircraftData[selectedHex];
    map.setView([ac.lat, ac.lon], 7);
    closePanel($("infoPanel"));
  });

  map.on("click", deselectAircraft);

  // Resize event listener to handle iOS Address bar resizing
  window.addEventListener('resize', () => {
      if(map) setTimeout(()=> map.invalidateSize(), 100);
  });
});

})();
</script>
